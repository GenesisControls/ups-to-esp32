#
# Espressif's Modbus stack, from the ESP Component Registry. Apache-2.0,
# which is compatible with this firmware's GPL-3.0-or-later.
#
# Pinned to the 1.x line deliberately: 2.0 reworked the slave API
# (mbc_slave_init/mbc_slave_setup became mbc_slave_create_serial and friends),
# and an automatic jump to it would break this component silently at the next
# clean build. Moving to 2.x is its own piece of work.
dependencies:
  espressif/esp-modbus: "^1.0"
